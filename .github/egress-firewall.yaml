# Hosts that jobs on GitHub's egress-firewall runner (runs-on: ubuntu-24.04-firewall) may reach.
# Opt in by setting the repository variable CLAUDE_RUNNER=ubuntu-24.04-firewall once the runner is enrolled.
# All other hosts are blocked, apart from any that GitHub's firewall allows by default.
# Add a host only when a workflow step needs it, name it in full (no '*'), and say what uses it.
mode: enforce
allow:
  # Claude API: model requests, and trading the workflow's GitHub identity token for a short-lived token
  - api.anthropic.com
  # GitHub API: the Claude Code action, gh in the review and verdict commands
  - api.github.com
  # Claude Code install script, fetched by the Claude Code action
  - claude.ai
  # Claude Code binary, downloaded by the install script
  - downloads.claude.ai
  # Node.js and Bun release downloads used by the action
  - release-assets.githubusercontent.com
  # npm packages installed by the action
  - registry.npmjs.org
  # pip index for the pytest and pyyaml install in claude.yml
  - pypi.org
  # pip package files for the same install
  - files.pythonhosted.org
