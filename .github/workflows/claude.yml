# @claude in issues, PR comments and PR reviews (tag mode). Owner-only on a public repository.
# Prerequisites and switches: docs/claude-automation.md
name: claude
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] -- owner-only if:, no PR code checked out or executed; action re-checks write access
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
permissions: {}
jobs:
  claude:
    # Bare block, no template expressions inside (gem CWE-94 rule). Owner-only is defence in depth:
    # the action also re-checks write access.
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push fix/<n>-<slug> branches
      pull-requests: write
      issues: write
      actions: read # mcp__github_ci__* tools
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python3 -m pip install --disable-pip-version-check 'pytest==8.3.5' 'pyyaml==6.0.3'
      - name: Run Claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "fix/"
          branch_name_template: "{{prefix}}{{entityNumber}}-{{description}}"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --allowedTools "Bash(python3 -m pytest:*),Bash(python3 -I probes.py mcp_reference_monitor.py),Bash(python3 -I lifecycle/gem_lifecycle.py dryrun),Bash(python3 -I gemctl.py scan-diff:*),Bash(python3 -I gemctl.py debt:*),Bash(python3 -I gemctl.py version),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(python3 -I gemctl.py gate:*),Bash(python3 -I gemctl.py heavy:*),Bash(python3 -I gemctl.py trailer:*),Bash(python3 install_hooks.py:*),Bash(sudo:*),Bash(bash lifecycle/deploy_awsbox.sh:*),Bash(./lifecycle/deploy_awsbox.sh:*),Bash(bash ci/apply_rulesets.sh:*),Bash(gh api:*),Bash(git push origin main*),Bash(git push --force*)"
            --append-system-prompt "CI context: GitHub Actions, no ForgeCore, no gem hooks, no B200. Never run gemctl gate/heavy/trailer, never edit .github/workflows/gem-review.yml or ci/gem-review.yml (they must stay byte-identical), never touch ci/rulesets/main.json. Branches are fix/<issue>-<slug>. Before finishing run python3 -m pytest -q, python3 -I probes.py mcp_reference_monitor.py and python3 -I lifecycle/gem_lifecycle.py dryrun and quote their summary lines."
