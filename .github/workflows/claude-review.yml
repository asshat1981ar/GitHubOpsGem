# Automatic PR review (agent mode, read-only). Not a required check.
# Claude reads the diff through `gh pr diff` and posts inline comments through the action's tool. Its top-level
# summary comes back as structured_output and a deterministic step upserts one fixed-marker comment (Claude has
# no comment-writing Bash tool). It never reads PR comments (comment filters only work in tag mode: gh pr view,
# gh issue view and gh api are denied) and runs no PR code or repo script.
# Read-only review: uses the workflow's GITHUB_TOKEN (never pushes), so no App token or id-token is involved.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths:
      - "**/*.py"
      - "hooks/**"
      - "lifecycle/**"
      - "gateway/**"
      - "ci/**"
      - ".github/**"
      - "CLAUDE.md"
      - "state/SELF_PROMPT.md"
permissions: {}
jobs:
  review:
    # Non-draft, same-repository PRs only (forks get no secrets). CLAUDE_PAUSE=true is the kill switch.
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
      pull-requests: write # inline review comments and the summary comment
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Review the pull request
        id: review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*)"
            --disallowedTools "Edit,MultiEdit,Write,WebFetch,WebSearch,Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh api:*),Bash(gh pr comment:*)"
            --json-schema '{"type":"object","required":["summary"],"properties":{"summary":{"type":"string","maxLength":6000}}}'
      - name: Post the review summary
        # No verdict (limit hit, error, cancelled) means no comment; the review is advisory and never a gate.
        if: ${{ !cancelled() && steps.review.outputs.structured_output != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if ! summary=$(jq -er '.summary | strings' <<<"$REVIEW_JSON"); then
            echo "::warning::Claude returned no usable summary; nothing posted"
            exit 0
          fi
          f="$RUNNER_TEMP/review-summary.md"
          { echo '<!-- claude-review-summary -->'; echo '## Claude review (advisory)'; echo; printf '%s\n' "${summary:0:6000}"; } > "$f"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review-summary -->"))) | .id' | head -1) || id=""
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$f" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$f"
          fi
