# Automatic PR review (agent mode, read-only). Not a required check.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths:
      - "**/*.py"
      - "hooks/**"
      - "lifecycle/**"
      - "gateway/**"
      - "ci/**"
      - ".github/**"
      - "CLAUDE.md"
      - "state/SELF_PROMPT.md"
permissions: {}
jobs:
  review:
    # Non-draft, same-repository PRs only (forks get no secrets). CLAUDE_PAUSE=true is the kill switch.
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Review the pull request
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,MultiEdit,Write,WebFetch,WebSearch"
