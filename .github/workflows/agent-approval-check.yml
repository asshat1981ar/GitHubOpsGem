# Requires a human approval on pull requests that contain agent-authored commits. Both triggers run the
# workflow file from the default branch, so a PR cannot edit this check to approve itself. Native reviews
# reach it through agent-approval-signal (a workflow_run, which also runs from the default branch).
# Mark `agent-approval-check` as required with ci/rulesets/agent-approval.json after one green run.
name: agent-approval-check
on:
  # zizmor: ignore[dangerous-triggers] -- no checkout, no PR code; composite action reads the event JSON and posts a commit status
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]   # an edited or deleted /approve changes the count
  # Review submissions and dismissals arrive through agent-approval-signal. workflow_run always runs this
  # file from the default branch, so a PR still cannot edit the check that gates it.
  # zizmor: ignore[dangerous-triggers] -- no checkout, no PR code, no artifacts read; the action only reads PR metadata
  workflow_run:
    workflows: [agent-approval-signal]
    types: [completed]
permissions: {}
jobs:
  check:
    # issue_comment also fires on plain issues; skip those early.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-approval-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check approvals
        uses: anthropics/claude-code-action/agent-approval-check@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          required_approvals: "1"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
          protected_bases: main
